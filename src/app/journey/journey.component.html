<div class="bg-grid min-h-screen z-10">

    <main class="h-full w-full flex flex-col items-center p-4 z-50">
        <div class="mt-6 sm:mt-10 w-full sm:w-5/6 md:w-4/6 flex flex-col gap-2 journey-fade-in">
            <h1 class="font-medium text-xl text-gray-800">My journey</h1>
            <p class="text-gray-600">
                A rough map of how I got here — the roles, the detours, and the things that stuck.
            </p>
        </div>

        <div class="w-full sm:w-5/6 md:w-4/6 relative mt-8 sm:mt-12 pb-10 sm:pb-24">

            <div class="absolute left-[7px] top-1 bottom-1 w-px bg-gray-200"></div>
            <div class="journey-line absolute left-[7px] top-1 bottom-1 w-px bg-[#12182b] origin-top"></div>

            <div class="flex flex-col gap-8">

                <div
                    *ngFor="let step of milestones; let i = index"
                    class="journey-item relative pl-10"
                    [style.animation-delay.ms]="200 + i * 130"
                >
                    <span
                        class="absolute left-0 top-2 h-[15px] w-[15px] rounded-full border-2 flex items-center justify-center"
                        [ngClass]="step.current ? 'border-[#12182b] bg-white' : 'border-gray-300 bg-white'"
                    >
                        <span
                            class="h-[6px] w-[6px] rounded-full"
                            [ngClass]="step.current ? 'bg-[#12182b] animate-pulse' : 'bg-gray-300'"
                        ></span>
                        <span
                            *ngIf="step.current"
                            class="absolute inline-flex h-full w-full rounded-full bg-[#12182b]/30 animate-ping"
                        ></span>
                    </span>

                    <div
                        class="back-banner group flex flex-col gap-1.5 p-4 border-2 border-gray-100 rounded-xl transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg"
                    >
                        <div class="flex flex-row items-center gap-2">
                            <span class="font-mono text-xs text-gray-400">{{ step.year }}</span>
                            <span
                                *ngIf="step.current"
                                class="text-[10px] uppercase tracking-wide font-medium text-white bg-[#12182b] rounded-full px-2 py-0.5"
                            >
                                Now
                            </span>
                        </div>

                        <h2 class="font-medium text-gray-800">{{ step.title }}</h2>
                        <p class="text-xs text-gray-500">{{ step.subtitle }}</p>
                        <p class="text-sm text-gray-600 leading-6">{{ step.description }}</p>

                        <div class="flex flex-row flex-wrap gap-1.5 mt-1">
                            <span
                                *ngFor="let tag of step.tags"
                                class="text-[10px] uppercase tracking-wide font-medium text-gray-600 bg-gray-100 rounded-full px-2 py-0.5"
                            >
                                {{ tag }}
                            </span>
                        </div>

                        <div class="flex flex-row flex-wrap gap-2.5 mt-1" *ngIf="step.images?.length">
                            <button
                                *ngFor="let media of step.images; let mediaIndex = index"
                                type="button"
                                class="relative h-24 w-24 rounded-lg overflow-hidden border-2 border-gray-100 hover:opacity-80 transition-opacity duration-200"
                                (click)="openLightbox(step.images!, mediaIndex)"
                            >
                                <video
                                    *ngIf="isVideo(media); else photoThumb"
                                    [src]="media"
                                    class="h-full w-full object-cover"
                                    muted
                                    playsinline
                                    preload="metadata"
                                ></video>
                                <ng-template #photoThumb>
                                    <img [src]="media" alt="" class="h-full w-full object-cover" />
                                </ng-template>
                                <span
                                    *ngIf="isVideo(media)"
                                    class="absolute inset-0 flex items-center justify-center bg-black/15"
                                >
                                    <svg width="20" height="20" viewBox="0 0 16 16" fill="white">
                                        <path d="M4 2.5v11l10-5.5z" />
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <div
        *ngIf="lightboxImages.length"
        class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
        (click)="closeLightbox()"
    >
        <button
            type="button"
            class="absolute top-4 right-4 text-white/80 hover:text-white text-2xl leading-none"
            (click)="closeLightbox()"
        >
            &times;
        </button>

        <button
            *ngIf="lightboxImages.length > 1"
            type="button"
            class="absolute left-4 sm:left-8 text-white/80 hover:text-white text-2xl leading-none px-2"
            (click)="showPrev($event)"
        >
            &#8249;
        </button>

        <video
            *ngIf="isVideo(lightboxImages[lightboxIndex]); else lightboxPhoto"
            [src]="lightboxImages[lightboxIndex]"
            class="max-h-[80vh] max-w-[90vw] rounded-lg"
            controls
            autoplay
            playsinline
            (click)="$event.stopPropagation()"
        ></video>
        <ng-template #lightboxPhoto>
            <img
                [src]="lightboxImages[lightboxIndex]"
                alt=""
                class="max-h-[80vh] max-w-[90vw] object-contain rounded-lg"
                (click)="$event.stopPropagation()"
            />
        </ng-template>

        <button
            *ngIf="lightboxImages.length > 1"
            type="button"
            class="absolute right-4 sm:right-8 text-white/80 hover:text-white text-2xl leading-none px-2"
            (click)="showNext($event)"
        >
            &#8250;
        </button>
    </div>

</div>
