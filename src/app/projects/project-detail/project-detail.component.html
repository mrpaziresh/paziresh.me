<div class="bg-grid min-h-screen z-10">

    <main class="h-full w-full flex flex-col items-center p-4 z-50" *ngIf="project; else notFound">
        <div class="mt-6 sm:mt-10 w-full sm:w-5/6 md:w-4/6 flex flex-col gap-6 sm:gap-8 pb-16">

            <a
                routerLink="/projects"
                class="flex flex-row items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800 transition-colors duration-200 w-fit"
            >
                <svg width="14" height="14" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.5 2.5L2.5 9.5M2.5 9.5H8M2.5 9.5V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to projects
            </a>

            <div class="back-banner border-2 border-gray-100 rounded-2xl overflow-hidden">
                <img [src]="project.image" [alt]="project.title" class="w-full max-h-[220px] sm:max-h-[320px] md:max-h-[420px] object-cover" />
            </div>

            <section class="flex flex-col gap-3">
                <div class="flex flex-row flex-wrap gap-1.5">
                    <span
                        *ngFor="let tag of project.tags"
                        class="text-[10px] uppercase tracking-wide font-medium text-gray-600 bg-gray-100 rounded-full px-2 py-0.5"
                    >
                        {{ tag }}
                    </span>
                </div>

                <h1 class="font-medium text-2xl text-gray-800">{{ project.title }}</h1>
                <p class="text-gray-600">{{ project.tagline }}</p>

                <div class="flex flex-row gap-6 sm:gap-8 text-sm text-gray-500 mt-1">
                    <div class="flex flex-col gap-0.5">
                        <span class="text-gray-400 text-xs">Year</span>
                        <span class="text-gray-700">{{ project.year }}</span>
                    </div>
                    <div class="flex flex-col gap-0.5">
                        <span class="text-gray-400 text-xs">Role</span>
                        <span class="text-gray-700">{{ project.role }}</span>
                    </div>
                </div>
            </section>

            <section class="flex flex-col gap-2">
                <h2 class="font-medium text-gray-800">Overview</h2>
                <p class="text-gray-600 leading-7">{{ project.overview }}</p>
            </section>

            <section class="flex flex-col gap-2" *ngIf="project.highlights.length">
                <h2 class="font-medium text-gray-800">Highlights</h2>
                <ul class="flex flex-col gap-1.5">
                    <li *ngFor="let highlight of project.highlights" class="flex flex-row gap-2 text-gray-600 leading-6">
                        <span class="text-gray-400">—</span>
                        {{ highlight }}
                    </li>
                </ul>
            </section>

            <section class="flex flex-col gap-2" *ngIf="project.stack.length">
                <h2 class="font-medium text-gray-800">Stack</h2>
                <div class="flex flex-row flex-wrap gap-1.5">
                    <span
                        *ngFor="let tech of project.stack"
                        class="text-xs font-medium text-gray-600 bg-gray-100 rounded-full px-3 py-1"
                    >
                        {{ tech }}
                    </span>
                </div>
            </section>

            <section class="flex flex-row flex-wrap gap-3 mt-2" *ngIf="project.liveUrl || project.repoUrl">
                <a
                    *ngIf="project.liveUrl"
                    [href]="project.liveUrl"
                    target="_blank"
                    rel="noopener"
                    class="bg-[#12182b] text-white text-sm font-medium rounded-full px-5 py-2.5 hover:opacity-90 transition-opacity duration-200"
                >
                    View live
                </a>
                <a
                    *ngIf="project.repoUrl"
                    [href]="project.repoUrl"
                    target="_blank"
                    rel="noopener"
                    class="border-2 border-gray-200 text-gray-700 text-sm font-medium rounded-full px-5 py-2 hover:bg-gray-50 transition-colors duration-200"
                >
                    View code
                </a>
            </section>

        </div>
    </main>

    <ng-template #notFound>
        <main class="h-full w-full flex flex-col items-center justify-center p-4 gap-3 min-h-screen">
            <p class="text-gray-700">This project doesn't exist.</p>
            <a routerLink="/projects" class="text-sm text-gray-500 hover:text-gray-800 underline">Back to projects</a>
        </main>
    </ng-template>

</div>
