<div class="bg-grid min-h-screen z-10">

    <main class="h-full w-full flex flex-col items-center p-4 z-50" *ngIf="article; else notFound">
        <div class="mt-6 sm:mt-10 w-full sm:w-5/6 md:w-5/6 flex flex-col gap-6 pb-16">

            <a
                routerLink="/notebook"
                class="flex flex-row items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800 transition-colors duration-200 w-fit"
            >
                <svg width="14" height="14" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.5 2.5L2.5 9.5M2.5 9.5H8M2.5 9.5V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to notebook
            </a>

            <header class="flex flex-col gap-3">
                <div class="flex flex-row items-center gap-3 text-xs text-gray-400 font-mono">
                    <span>{{ article.date }}</span>
                    <span *ngIf="readTime">{{ readTime }} min read</span>
                </div>
                <h1 class="font-medium text-2xl text-gray-800 leading-snug">{{ article.title }}</h1>
            </header>

            <div class="border-t-[0.5px] border-gray-200"></div>

            <article class="notebook-content flex flex-col gap-4 text-gray-700 leading-7" [innerHTML]="contentHtml"></article>

            <div class="flex flex-row items-center gap-2 mt-2 pt-6 border-t-[0.5px] border-gray-200">
                <button
                    type="button"
                    (click)="copyLink()"
                    class="flex flex-row items-center gap-1.5 text-sm text-gray-600 border-2 border-gray-200 rounded-full px-4 py-2 hover:bg-gray-50 transition-colors duration-200"
                >
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.5 9.5L9.5 6.5M7 4L7.94 3.06A3 3 0 1 1 12.19 7.3L11 8.5M9 12L8.06 12.94A3 3 0 1 1 3.81 8.7L5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    {{ linkCopied ? 'Link copied' : 'Copy link' }}
                </button>
            </div>

        </div>
    </main>

    <ng-template #notFound>
        <main class="h-full w-full flex flex-col items-center justify-center p-4 gap-3 min-h-screen">
            <p class="text-gray-700">This post doesn't exist.</p>
            <a routerLink="/notebook" class="text-sm text-gray-500 hover:text-gray-800 underline">Back to notebook</a>
        </main>
    </ng-template>

</div>
