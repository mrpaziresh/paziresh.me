<div class="bg-grid min-h-screen z-10">

    <main class="h-full w-full flex flex-col items-center p-4 z-50">
        <div class="mt-6 sm:mt-10 w-full sm:w-5/6 md:w-4/6 flex flex-col gap-6 sm:gap-10 pb-16">

            <section class="flex flex-row items-start justify-between gap-4">
                <div class="flex flex-col gap-2">
                    <h1 class="font-medium text-xl text-gray-800">Notebook</h1>
                    <p class="font-normal text-gray-600">
                        Mostly about software engineering and artificial intelligence.
                    </p>
                </div>
                <button
                    type="button"
                    class="shrink-0 bg-white p-2 flex flex-col justify-center items-center rounded-lg border-2 border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors duration-200"
                    aria-label="Subscribe"
                >
                    <img class="rounded-full" height="20" width="18" src="./assets/icons/subsctibe.svg" alt="" />
                </button>
            </section>

            <div class="flex flex-col">
                <a
                    *ngFor="let article of articles"
                    [routerLink]="['/notebook', article.slug]"
                    class="group flex flex-col gap-1.5 py-5 border-t-[0.5px] border-gray-200 last:border-b-[0.5px] -mx-3 px-3 rounded-lg hover:bg-white/60 transition-colors duration-200 cursor-pointer"
                >
                    <div class="flex flex-row items-center gap-3 text-xs text-gray-400 font-mono">
                        <span>{{ article.date }}</span>
                        <span *ngIf="getReadTime(article.content)">{{ getReadTime(article.content) }} min read</span>
                    </div>
                    <h2 class="font-medium text-gray-800 group-hover:text-black transition-colors duration-200">
                        {{ article.title }}
                    </h2>
                    <p class="text-sm text-gray-500">{{ getExcerpt(article.content) }}</p>
                </a>
            </div>

        </div>
    </main>

</div>
